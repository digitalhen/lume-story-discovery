name = "story-discovery-feed"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

# Cron: refresh hourly. 4 NewsAPI requests per refresh × 24 = 96/day, under the
# dev-tier 100/day limit.
[triggers]
crons = ["0 * * * *"]

# KV namespace holding the cached feed.
# Create with: wrangler kv:namespace create FEED_KV
# Then paste the returned id below.
[[kv_namespaces]]
binding = "FEED_KV"
id = "514eaf62000642aab26a9a378d9aca34"

# Secrets (set via `wrangler secret put`):
#   NEWSAPI_KEY  — from https://newsapi.org
