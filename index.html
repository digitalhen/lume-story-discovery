<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reuters semantic search POC</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --muted: #666;
    --bg: #fafafa;
    --card: #fff;
    --border: #e3e3e3;
    --accent: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --muted: #999; --bg: #161616; --card: #1f1f1f; --border: #2c2c2c; }
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; padding: 32px 20px 80px;
    max-width: 1240px; margin-inline: auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #status {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: var(--muted);
  }
  #status .bar {
    height: 6px; background: var(--border); border-radius: 4px; margin-top: 8px; overflow: hidden;
    display: none;
  }
  #status .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s; }
  #q {
    width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg);
  }
  #q:disabled { opacity: 0.5; }
  #results {
    margin-top: 20px;
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;
  }
  @media (max-width: 1080px) { #results { grid-template-columns: 1fr; } }
  .col h2 {
    font-size: 12px; margin: 0 0 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  }
  .col-list { display: flex; flex-direction: column; gap: 12px; }
  .hit {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px;
    border-left: 3px solid var(--border);
  }
  .hit.shared { border-left-color: var(--accent); }
  .hit h3 { margin: 0 0 4px; font-size: 16px; }
  .hit h3 a { color: var(--fg); text-decoration: none; }
  .hit h3 a:hover { text-decoration: underline; }
  .hit .meta { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .hit .desc { color: var(--fg); font-size: 14px; }
  .score { float: right; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .controls button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
  }
  .controls button:hover { color: var(--fg); }
</style>
</head>
<body>
  <h1>Reuters semantic search POC</h1>
  <div class="sub">995 articles · <code>Xenova/all-MiniLM-L6-v2</code> in-browser via transformers.js</div>

  <div id="status">Booting…<div class="bar"><div></div></div></div>
  <input id="q" type="search" placeholder="Search semantically… (e.g. 'central bank cuts interest rates')" disabled autofocus />
  <div class="controls">
    <button id="reindex">Re-index</button>
    <span id="count"></span>
  </div>

  <div id="results">
    <div class="col"><h2>Semantic (MiniLM)</h2><div class="col-list" id="results-sem"></div></div>
    <div class="col"><h2>Hybrid (RRF)</h2><div class="col-list" id="results-hybrid"></div></div>
    <div class="col"><h2>BM25 (lexical)</h2><div class="col-list" id="results-bm25"></div></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
