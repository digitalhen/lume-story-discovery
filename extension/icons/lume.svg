<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a1626"/>
  <!-- thin connecting lines first so dots sit on top -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.4" fill="none">
    <line x1="32" y1="32" x2="14" y2="22"/>
    <line x1="32" y1="32" x2="48" y2="18"/>
    <line x1="32" y1="32" x2="50" y2="44"/>
    <line x1="32" y1="32" x2="18" y2="46"/>
  </g>
  <!-- glow under the focal node -->
  <circle cx="32" cy="32" r="13" fill="url(#glowB)"/>
  <!-- neighbor nodes -->
  <circle cx="14" cy="22" r="2.6" fill="#94a3b8"/>
  <circle cx="48" cy="18" r="2.6" fill="#94a3b8"/>
  <circle cx="50" cy="44" r="2.6" fill="#94a3b8"/>
  <circle cx="18" cy="46" r="2.6" fill="#94a3b8"/>
  <!-- focal node -->
  <circle cx="32" cy="32" r="5.5" fill="#fbbf24"/>
</svg>
